<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Profile | Carmel Hospital</title>
    <link rel="stylesheet" href="style.css?v=1.3">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Global Loader -->
    <div id="global-loader" class="global-loader">
        <div class="loader-content">
            <img src="assets/landing/main_logo-1-scaled.png" alt="Carmel Hospital Logo">
        </div>
    </div>
    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('global-loader');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 500);
                }
            }, 500);
        });
    </script>

    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="assets/landing/main_logo-1-scaled.png" alt="Carmel Hospital" class="nav-logo-img"> Carmel Hospital
            </a>
            <div class="nav-links">
                <a href="index.html#home">Home</a>
                <a href="about.html">About</a>
                <a href="department.html">Departments</a>
                <a href="services.html">Services</a>
                <a href="doctor.html" style="border-bottom: 2px solid var(--secondary-color);">Doctors</a>
                <a href="index.html#emergency" class="btn-primary btn-nav">Emergency</a>
            </div>
            <div class="hamburger">
                <i class="fa-solid fa-bars"></i>
            </div>
        </div>
    </nav>

    <!-- Mobile Menu -->
    <div class="mobile-menu" id="mobile-menu">
        <a href="index.html#home">Home</a>
        <a href="about.html">About</a>
        <a href="department.html">Departments</a>
        <a href="services.html">Services</a>
        <a href="doctor.html">Doctors</a>
        <a href="index.html#emergency" class="btn-primary">Emergency</a>
    </div>

    <!-- Header Section -->
    <header class="profile-page-header">
        <div class="profile-controls">
            <button class="control-btn" id="prev-profile" aria-label="Previous Doctor"><i class="fa-solid fa-arrow-left"></i></button>
            <h1 style="color: var(--primary-color);">Doctor Profile</h1>
            <button class="control-btn" id="next-profile" aria-label="Next Doctor"><i class="fa-solid fa-arrow-right"></i></button>
        </div>
    </header>

    <!-- Dynamic Profile Content -->
    <section class="profile-section">
        <div class="profile-container" id="profile-container">
            <!-- Left: Image & Badge -->
            <div class="profile-image-section anim-target">
                <div class="profile-image-wrapper">
                    <img id="p-image" src="" alt="Doctor Image">
                    <div class="profile-badge">
                        <h3 id="p-badge-name"></h3>
                        <p id="p-badge-spec"></p>
                    </div>
                </div>
            </div>

            <!-- Right: Info -->
            <div class="profile-info-section">
                <div class="profile-info anim-target" style="transition-delay: 0.1s;">
                    <div>
                        <h2 class="profile-name" id="p-name"></h2>
                        <div class="profile-specialty">
                            <i class="fa-solid fa-stethoscope"></i> <span id="p-specialization"></span>
                        </div>
                    </div>

                    <div class="profile-meta">
                        <div class="meta-item">
                            <i class="fa-solid fa-graduation-cap"></i> <span id="p-qualification"></span>
                        </div>
                        <div class="meta-item">
                            <i class="fa-solid fa-clock"></i> <span id="p-experience"></span>
                        </div>
                    </div>

                    <div class="profile-about anim-target" style="transition-delay: 0.2s;">
                        <h3>About Doctor</h3>
                        <div id="p-about"></div>
                    </div>



                    <div class="profile-actions anim-target" style="transition-delay: 0.3s;">
                        <a href="mailto:info@carmelhosp.org" class="btn-primary"><i class="fa-solid fa-envelope"></i> Contact Doctor</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Thumbnails Strip -->
    <section class="profile-thumbnails-wrapper">
        <div class="profile-thumbnails" id="thumbnail-strip">
            <!-- Populated dynamically -->
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-col">
                <a href="#" class="logo footer-logo">
                    <img src="assets/landing/main_logo-1-scaled.png" alt="Carmel Hospital" class="nav-logo-img"> Carmel Hospital
                </a>
                <p>Providing the best possible care with love, service, life, and sacrifice.</p>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="doctors.js"></script>
    <script src="profile.js"></script>
</body>
</html>
